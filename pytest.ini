[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# test_postgres.py is a manual, module-level script that talks to the live
# PostgreSQL database - it must never run as part of the automated suite.
addopts = --ignore=tests/test_postgres.py
markers =
    integration: marks tests that require a real network and API key (deselect with -m "not integration")
